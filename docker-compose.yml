# Quick start:   docker compose up            (then open http://localhost:8501)
# With Ollama:   docker compose --profile ollama up
services:
  app:
    build: .
    image: ghcr.io/${GITHUB_OWNER:-your-github-name}/ai-case-dd-assistant:latest
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/data
    restart: unless-stopped

  # Optional free local AI with no limits (needs a decent computer).
  # After it starts:  docker compose exec ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU (optional): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  app-data:
  ollama-models:
